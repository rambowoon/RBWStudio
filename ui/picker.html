<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0b0f17;
      cursor: crosshair;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #screenCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }
    #loupeCard {
      position: fixed;
      pointer-events: none;
      width: 184px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    #loupeCanvas {
      width: 168px;
      height: 168px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      image-rendering: pixelated;
      display: block;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 2px 2px 0;
    }
    #swatchBox {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      flex-shrink: 0;
    }
    .color-meta {
      min-width: 0;
      flex: 1;
    }
    #colorPrimary {
      color: #f8fafc;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #colorSecondary {
      color: #94a3b8;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.5px;
      margin-top: 2px;
      white-space: nowrap;
    }
    .hint-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      pointer-events: none;
      background: rgba(15, 23, 42, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .mode-pill {
      color: #5ff0be;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <canvas id="screenCanvas"></canvas>

  <div id="loupeCard">
    <canvas id="loupeCanvas" width="168" height="168"></canvas>
    <div class="info-row">
      <div id="swatchBox"></div>
      <div class="color-meta">
        <div id="colorPrimary">#000000</div>
        <div id="colorSecondary">rgb(0, 0, 0)</div>
      </div>
    </div>
  </div>

  <div class="hint-bar">
    <span><span class="kbd">Click trái</span> Copy <span id="modeLabel" class="mode-pill">HEX</span></span>
    <span><span class="kbd">Tab</span> Đổi định dạng</span>
    <span><span class="kbd">Esc</span> / <span class="kbd">Click phải</span> Hủy</span>
  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    const screenCanvas = document.getElementById("screenCanvas");
    const sctx = screenCanvas.getContext("2d", { willReadFrequently: true });
    const loupeCard = document.getElementById("loupeCard");
    const loupeCanvas = document.getElementById("loupeCanvas");
    const lctx = loupeCanvas.getContext("2d");
    const swatchBox = document.getElementById("swatchBox");
    const colorPrimary = document.getElementById("colorPrimary");
    const colorSecondary = document.getElementById("colorSecondary");
    const modeLabel = document.getElementById("modeLabel");

    let meta = { monW: window.innerWidth, monH: window.innerHeight, cursorX: 0, cursorY: 0 };
    let imgData = null;
    let copyMode = "hex"; // "hex" | "rgb"
    let currentHex = "#000000";
    let currentRgb = "rgb(0, 0, 0)";
    let lastClientX = -1;
    let lastClientY = -1;

    function toHex(n) {
      return n.toString(16).padStart(2, "0").toUpperCase();
    }

    function getPixelAt(px, py) {
      if (!imgData) return [0, 0, 0];
      const cx = Math.max(0, Math.min(meta.monW - 1, px));
      const cy = Math.max(0, Math.min(meta.monH - 1, py));
      const off = (cy * meta.monW + cx) * 4;
      const d = imgData.data;
      return [d[off], d[off + 1], d[off + 2]];
    }

    function updateLoupe(clientX, clientY) {
      lastClientX = clientX;
      lastClientY = clientY;
      const rect = screenCanvas.getBoundingClientRect();
      const scaleX = meta.monW / Math.max(1, rect.width);
      const scaleY = meta.monH / Math.max(1, rect.height);
      const px = Math.round(clientX * scaleX);
      const py = Math.round(clientY * scaleY);

      const [r, g, b] = getPixelAt(px, py);
      currentHex = `${toHex(r)}${toHex(g)}${toHex(b)}`;
      currentRgb = `rgb(${r}, ${g}, ${b})`;

      swatchBox.style.background = `#${currentHex}`;
      colorPrimary.textContent = copyMode === "hex" ? currentHex : currentRgb;
      colorSecondary.textContent = copyMode === "hex" ? `${currentRgb}  •  ${px},${py}` : `${currentHex}  •  ${px},${py}`;

      // Draw 11x11 zoomed pixel grid (each pixel = 15px -> 165px centered inside 168x168)
      const grid = 11;
      const half = Math.floor(grid / 2);
      const cell = loupeCanvas.width / grid;
      lctx.clearRect(0, 0, loupeCanvas.width, loupeCanvas.height);

      for (let dy = -half; dy <= half; dy++) {
        for (let dx = -half; dx <= half; dx++) {
          const sx = px + dx;
          const sy = py + dy;
          if (sx < 0 || sy < 0 || sx >= meta.monW || sy >= meta.monH) {
            lctx.fillStyle = "#090d16";
          } else {
            const [pr, pg, pb] = getPixelAt(sx, sy);
            lctx.fillStyle = `rgb(${pr},${pg},${pb})`;
          }
          const rx = (dx + half) * cell;
          const ry = (dy + half) * cell;
          lctx.fillRect(rx, ry, Math.ceil(cell), Math.ceil(cell));
        }
      }

      // Pixel grid hairlines
      lctx.strokeStyle = "rgba(255,255,255,0.12)";
      lctx.lineWidth = 1;
      for (let i = 1; i < grid; i++) {
        const pos = Math.round(i * cell) + 0.5;
        lctx.beginPath();
        lctx.moveTo(pos, 0);
        lctx.lineTo(pos, loupeCanvas.height);
        lctx.moveTo(0, pos);
        lctx.lineTo(loupeCanvas.width, pos);
        lctx.stroke();
      }

      // Highlight center target pixel
      const cX = half * cell;
      const cY = half * cell;
      lctx.strokeStyle = "#ffffff";
      lctx.lineWidth = 2;
      lctx.strokeRect(cX + 1, cY + 1, cell - 2, cell - 2);
      lctx.strokeStyle = "#0f172a";
      lctx.lineWidth = 1;
      lctx.strokeRect(cX, cY, cell, cell);

      // Smart positioning inside viewport
      const cardW = 192;
      const cardH = 228;
      let left = clientX + 20;
      let top = clientY + 20;
      if (left + cardW > window.innerWidth - 10) left = clientX - cardW - 14;
      if (top + cardH > window.innerHeight - 10) top = clientY - cardH - 14;
      loupeCard.style.left = `${Math.max(8, left)}px`;
      loupeCard.style.top = `${Math.max(8, top)}px`;
      loupeCard.style.display = "flex";
    }

    async function init() {
      if (!invoke) return;
      try {
        meta = await invoke("get_picker_data");
        const buf = await invoke("get_picker_image");
        const blob = new Blob([buf], { type: "image/bmp" });
        const bitmap = await createImageBitmap(blob);

        screenCanvas.width = meta.monW;
        screenCanvas.height = meta.monH;
        sctx.drawImage(bitmap, 0, 0, meta.monW, meta.monH);
        bitmap.close();
        imgData = sctx.getImageData(0, 0, meta.monW, meta.monH);

        await invoke("show_picker_window");
        const initX = (meta.cursorX / Math.max(1, meta.monW)) * window.innerWidth;
        const initY = (meta.cursorY / Math.max(1, meta.monH)) * window.innerHeight;
        updateLoupe(initX, initY);
      } catch (err) {
        console.error("Color picker init failed:", err);
        await invoke("cancel_color_picker");
      }
    }

    window.addEventListener("mousemove", (e) => {
      updateLoupe(e.clientX, e.clientY);
    });

    window.addEventListener("mousedown", async (e) => {
      if (e.button === 0) {
        e.preventDefault();
        updateLoupe(e.clientX, e.clientY);
        const val = copyMode === "hex" ? currentHex : currentRgb;
        await invoke("finish_color_picker", { value: val, hex: currentHex });
      } else if (e.button === 2) {
        e.preventDefault();
        await invoke("cancel_color_picker");
      }
    });

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("keydown", async (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        await invoke("cancel_color_picker");
      } else if (e.key === "Tab" || e.key === " ") {
        e.preventDefault();
        copyMode = copyMode === "hex" ? "rgb" : "hex";
        modeLabel.textContent = copyMode.toUpperCase();
        if (lastClientX >= 0) updateLoupe(lastClientX, lastClientY);
      }
    });

    init();
  </script>
</body>
</html>
